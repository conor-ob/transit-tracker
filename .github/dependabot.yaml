# Dependabot baseline. Source of truth: conor-ob/hq templates/dependabot/dependabot.yaml
# Policy and reasons: conor-ob/hq docs/dependabot.md
#
# Copy to .github/dependabot.yaml.
# Keep the baseline entries as they are. Repo-specific changes go under
# "Repo exceptions" comments, so a diff against the template shows only them.
version: 2

updates:
  # One entry per pnpm workspace, at the workspace root. It covers every
  # package in the workspace and the catalogs in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # Majors stay out of the group, so each one gets its own PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      # Without prefix-development, dev dependencies use this prefix too.
      prefix: chore
      include: scope
    # Repo exceptions: deliberate ignores.
    ignore:
      # @types/node tracks the Node runtime major, moved deliberately with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    cooldown:
      default-days: 7
    groups:
      # Majors stay out of the group, so each one gets its own PR.
      github-actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope

  # Add when the repo has a Dockerfile. List every directory that has one.
  - package-ecosystem: docker
    directories:
      # Repo exceptions: every app and job directory with a Dockerfile.
      - /apps/dartboard
      - /apps/server
      - /apps/web
      - /jobs/schedule-sync
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope
    # Repo exceptions: deliberate ignores.
    ignore:
      # Node majors are moved deliberately, to the next LTS, alongside engines.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Add when the repo has compose files. List every directory that has one.
  - package-ecosystem: docker-compose
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Dublin
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope
    # Repo exceptions: deliberate ignores.
    ignore:
      # Redis majors change the data format and must match Railway and CI.
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
