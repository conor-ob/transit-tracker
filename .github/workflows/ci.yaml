name: ⚡️ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# PR runs share a group per branch, so a new push cancels the stale run.
# Each main commit gets its own group, so no main run is ever cancelled:
# GitHub keeps one waiting run per group and cancels it when another queues,
# and a cancelled run on main would hold back that commit's deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job must be listed in the gate job's needs:, or it can fail and the
# PR still merges
jobs:
  node:
    name: 🟢 Node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Redis Trip Update store's tests run against a real Redis
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each app's env schema needs its variables at build and test time
      - name: Create .env files
        run: |
          for f in $(git ls-files '*.env.example'); do
            cp "$f" "${f%.example}"
          done

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        id: install
        run: pnpm install --frozen-lockfile

      # One step per task, and each runs even if an earlier one failed, so one
      # run reports every failure. They still skip if install failed

      # Run the tool's own read-only bundle (format, lint rules, import
      # order) directly, never a script: the lint script runs lint rules only
      - name: Format and lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm biome ci .

      # Turbo runs the three tasks across the workspace, says which failed,
      # and --continue runs the rest after a failure
      - name: Typecheck, build and test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm turbo run typecheck build test --continue

  # The deploy builds these Dockerfiles, so build them here first. Otherwise
  # an auto-merged base image update could break a build and only show up as
  # a failed deploy on main. One entry per image that ships. Built, never
  # pushed, with no cache
  docker:
    name: 🐳 Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: apps/server/Dockerfile
          # Their builds load the env schema in vite.config.ts, so they need
          # the build args Railway passes. Values match each .env.example
          - image: web
            dockerfile: apps/web/Dockerfile
            build-args: |
              SERVER_URL=http://localhost:4000
          - image: dartboard
            dockerfile: apps/dartboard/Dockerfile
            build-args: |
              SERVER_URL=http://localhost:4000
          - image: schedule-sync
            dockerfile: jobs/schedule-sync/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: |
          mapfile -t args < <(sed '/^$/d; s/^/--build-arg=/' <<<"$BUILD_ARGS")
          docker build --file "$DOCKERFILE" "${args[@]}" .
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARGS: ${{ matrix.build-args }}

  # The Gate check: the only required status check in protect-main. It runs
  # even when a job before it failed (a skipped required check counts as
  # passed), and fails if any needed job failed or was cancelled. A skipped
  # job counts as fine, so jobs limited to main or to some paths don't block
  # PRs. always(), not !cancelled(), so a cancelled run leaves it red
  gate:
    name: 🚦 Gate
    needs:
      - node
      - docker
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # always() here too: a step's default success() would skip it on a
      # cancelled run, and the gate would pass with nothing checked
      - name: Check results
        if: ${{ always() }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' <<<"$NEEDS" >/dev/null
        env:
          NEEDS: ${{ toJSON(needs) }}
