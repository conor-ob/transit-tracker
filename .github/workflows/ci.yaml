name: ⚡️ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded PR runs only, so every main commit gets a result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: 🔍 Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install deps
        id: setup
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm biome ci .

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test
