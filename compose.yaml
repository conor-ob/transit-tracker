services:
  transit-tracker-api:
    image: ghcr.io/tjhorner/transit-tracker-api:main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/gtfs?sslmode=disable"
      FEED_SYNC_SCHEDULE: "0 3 * * *"
      GTFS_RT_MIN_CACHE_AGE: "60s"
      LOG_JSON: "true"
      FEEDS_CONFIG: |
        feeds:
          nta:
            name: Transport for Ireland
            description: Ireland
            gtfs:
              static:
                url: https://www.transportforireland.ie/transitData/Data/GTFS_Realtime.zip
              rtTripUpdates:
                url: https://api.nationaltransport.ie/gtfsr/v2/TripUpdates
                headers:
                  x-api-key: ${NTA_API_KEY}
    ports:
      - "3000:3000"

  schedule-proxy:
    build:
      context: .
      dockerfile: apps/schedule-proxy/Dockerfile
    depends_on:
      - transit-tracker-api
    environment:
      PORT: "8080"
      TRANSIT_TRACKER_API_URL: "http://transit-tracker-api:3000"
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18
    expose:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gtfs
    volumes:
      - "db:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d gtfs"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8
    expose:
      - "6379"

volumes:
  db:
